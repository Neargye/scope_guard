name: ubuntu

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - { cc: "gcc-9",    cxx: "g++-9",      os: "ubuntu-22.04", strict: "c++11 c++17" } # Minimum supported GCC.
        - { cc: "gcc-14",   cxx: "g++-14",     os: "ubuntu-24.04" }
        - { cc: "gcc-16",   cxx: "g++-16",     os: "ubuntu-26.04", strict: "c++11 c++17 c++20 c++23", sanitize: true }
        - { cc: "clang-14", cxx: "clang++-14", os: "ubuntu-22.04" }
        - { cc: "clang-22", cxx: "clang++-22", os: "ubuntu-24.04" } # Macro-local __COUNTER__ workaround.
        - { cc: "clang-23", cxx: "clang++-23", os: "ubuntu-24.04", strict: "c++11 c++17 c++20 c++23", sanitize: true } # system_header __COUNTER__ path.

    name: "${{ matrix.compiler.cc }}"
    runs-on: ${{ matrix.compiler.os }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@v7

    - name: Install compiler
      run: |
        if command -v "$CXX" > /dev/null 2>&1; then
          exit 0
        fi

        case "$CC" in
          clang-*)
            codename="$(lsb_release -cs)"
            wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/llvm-archive-keyring.gpg > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${CC#clang-} main" | sudo tee /etc/apt/sources.list.d/llvm.list
            package="$CC"
            ;;
          gcc-*)
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            package="$CXX"
            ;;
        esac
        sudo apt-get update
        sudo apt-get install -y "$package"

    - name: Compiler version
      run: |
        compiler="$("$CXX" --version | head -n 1)"
        echo "$compiler"
        echo "::notice title=Compiler::$compiler"
        echo "**Compiler:** $compiler" >> "$GITHUB_STEP_SUMMARY"

    - name: Strict warnings
      if: ${{ matrix.compiler.strict }}
      env:
        STANDARDS: ${{ matrix.compiler.strict }}
      run: |
        # Public macros expand in user code compiled with user flags, so keep them clean under strict warnings.
        flags=(-Wall -Wextra -pedantic-errors -Werror -Wconversion -Wsign-conversion -Wold-style-cast -Wundef
               -Wcast-qual -Wnon-virtual-dtor -Wnull-dereference -Wimplicit-fallthrough)
        case "$CXX" in
          g++*) flags+=(-Wshadow -Wuseless-cast -Wduplicated-branches -Wduplicated-cond -Wlogical-op) ;;
          *)    flags+=(-Wshadow-all -Wextra-semi -Wcomma -Wunreachable-code) ;;
        esac
        check() {
          echo "$CXX -std=$std $*"
          "$CXX" -std="$std" -fsyntax-only "${flags[@]}" -Iinclude -Itest/3rdparty/doctest -DDOCTEST_CONFIG_USE_STD_HEADERS "$@"
        }

        for std in $STANDARDS; do
          echo "::group::$std"
          for src in example/*.cpp test/test_main.cpp test/test.cpp test/macro_test.cpp; do
            check "$src"
          done
          for config in NO_THROW_ACTION SUPPRESS_THROW_ACTION THROWING_MOVE_CONSTRUCTION; do
            check test/config_test.cpp -DSCOPE_GUARD_TEST_$config
          done
          for policy in NO_THROW SUPPRESS_THROW; do
            check test/macro_test.cpp -DSCOPE_GUARD_${policy}_ACTION -DSCOPE_GUARD_NO_THROW_CONSTRUCTIBLE
          done
          for policy in MAY_THROW NO_THROW SUPPRESS_THROW; do
            check test/macro_test.cpp -DSCOPE_GUARD_${policy}_ACTION -fno-exceptions
          done
          if [[ "$CXX" == clang++* ]]; then
            check test/macro_test.cpp -DSCOPE_GUARD_SUPPRESS_THROW_ACTION -fexceptions -fno-cxx-exceptions
          fi
          if [[ "$std" == c++11 ]]; then
            # Pre-C++17 exception count fallback, in both include orders.
            check test/config_test.cpp -DSCOPE_GUARD_TEST_CXXABI -DSCOPE_GUARD_TEST_CXXABI_FIRST
            check test/config_test.cpp -DSCOPE_GUARD_TEST_CXXABI
          fi
          echo "::endgroup::"
        done

    - name: Build and test
      run: |
        for build_type in Release Debug; do
          echo "::group::$build_type"
          cmake -S . -B "build-$build_type" -DCMAKE_BUILD_TYPE="$build_type"
          cmake --build "build-$build_type" --parallel "$(nproc)"
          ctest --test-dir "build-$build_type" --parallel "$(nproc)" --output-on-failure --no-tests=error
          echo "::endgroup::"
        done

    - name: Sanitizers (ASan + UBSan)
      if: ${{ matrix.compiler.sanitize }}
      env:
        CXXFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
        LDFLAGS: -fsanitize=address,undefined
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
        UBSAN_OPTIONS: print_stacktrace=1
      run: |
        # Newer runner kernels use more ASLR entropy than older sanitizer runtimes support.
        sudo sysctl vm.mmap_rnd_bits=28
        cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-sanitize --parallel "$(nproc)"
        ctest --test-dir build-sanitize --parallel "$(nproc)" --output-on-failure --no-tests=error
